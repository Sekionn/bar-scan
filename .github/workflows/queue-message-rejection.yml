name: Queue Message Rejection

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-unassigned-shop-message:
    name: Reject unassigned-shop queue message
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bar_scan
          MYSQL_USER: bar_scan
          MYSQL_PASSWORD: bar_scan
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: bar_scan
          RABBITMQ_DEFAULT_PASS: bar_scan
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Start backend
        env:
          SERVER_SSL_ENABLED: 'false'
          DB_URL: jdbc:mysql://127.0.0.1:3306/bar_scan?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: bar_scan
          DB_PASSWORD: bar_scan
          JWT_SECRET: ci-jwt-secret-must-be-at-least-32-bytes-long
          RABBITMQ_HOST: 127.0.0.1
          RABBITMQ_PORT: '5672'
          RABBITMQ_USERNAME: bar_scan
          RABBITMQ_PASSWORD: bar_scan
          APP_BOOTSTRAP_ADMIN_ENABLED: 'true'
          APP_BOOTSTRAP_ADMIN_PASSWORD: ci-only-password
        run: |
          chmod +x mvnw
          nohup ./mvnw -q spring-boot:run > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for attempt in {1..60}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/auth/login || true)
            if [ "$status" != "000" ]; then
              exit 0
            fi
            sleep 2
          done

          cat backend.log
          exit 1

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Verify unassigned-shop messages are discarded
        env:
          RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
          RABBITMQ_USERNAME: bar_scan
          RABBITMQ_PASSWORD: bar_scan
          UNASSIGNED_USER_ID: 00000000-0000-0000-0000-000000000002
        run: k6 run k6/reject-unassigned-user-product-created.js

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: queue-message-rejection-logs
          path: |
            backend.log
            target/surefire-reports
          if-no-files-found: warn
