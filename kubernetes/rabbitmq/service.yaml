apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: bar-scan
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
      nodePort: 30672
    - name: management
      port: 15672
      targetPort: management
      nodePort: 31672
