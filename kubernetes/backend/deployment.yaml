apiVersion: apps/v1
kind: Deployment
metadata:
  name: bar-scan-backend
  namespace: bar-scan
  labels:
    app.kubernetes.io/name: bar-scan-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bar-scan-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bar-scan-backend
    spec:
      imagePullSecrets:
        - name: ghcr-read
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do sleep 2; done"]
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do sleep 2; done"]
      containers:
        - name: backend
          image: ghcr.io/sekionn/bar-scan-backend:kubernetes-setup
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:InitialRAMPercentage=20.0 -XX:MaxRAMPercentage=60.0
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_PASS
          envFrom:
            - configMapRef:
                name: bar-scan-backend-config
            - secretRef:
                name: bar-scan-backend-secrets
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
