spring.application.name=bar-scan
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]
jwt.secret=${JWT_SECRET:bar-scan-development-secret-must-be-at-least-32-bytes}
jwt.expiration-ms=86400000
# https properties
server.port=8080
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:keystore.p12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:220598Sjk}
server.ssl.keyStoreType=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.keyAlias=${SERVER_SSL_KEY_ALIAS:tomcat}

# mysql properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bar_scan?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:bar_scan}
spring.datasource.password=${DB_PASSWORD:bar_scan}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# data retention properties
app.retention.scan-data-years=${APP_RETENTION_SCAN_DATA_YEARS:5}
app.retention.scan-data-cleanup-cron=${APP_RETENTION_SCAN_DATA_CLEANUP_CRON:0 30 3 * * *}

# rabbitmq message queue properties
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.messaging.product-created-exchange=${PRODUCT_CREATED_EXCHANGE:bar-scan.products}
app.messaging.product-created-queue=${PRODUCT_CREATED_QUEUE:bar-scan.product-created}
app.messaging.product-created-routing-key=${PRODUCT_CREATED_ROUTING_KEY:product.created}
app.messaging.sync-batch-exchange=${SYNC_BATCH_EXCHANGE:bar-scan.sync-batches}
app.messaging.sync-batch-started-queue=${SYNC_BATCH_STARTED_QUEUE:bar-scan.sync-batch-started}
app.messaging.sync-batch-started-routing-key=${SYNC_BATCH_STARTED_ROUTING_KEY:sync-batch.started}
app.messaging.sync-batch-publish-completed-queue=${SYNC_BATCH_PUBLISH_COMPLETED_QUEUE:bar-scan.sync-batch-publish-completed}
app.messaging.sync-batch-publish-completed-routing-key=${SYNC_BATCH_PUBLISH_COMPLETED_ROUTING_KEY:sync-batch.publish-completed}

# payment/signup properties
app.payments.provider=${PAYMENT_PROVIDER:dev}
app.payments.dev-checkout-base-url=${PAYMENT_DEV_CHECKOUT_BASE_URL:http://localhost:8080/payments/dev/checkout}
app.super-admin.email=${APP_SUPER_ADMIN_EMAIL:}
app.signup.notification-mode=${APP_SIGNUP_NOTIFICATION_MODE:log}
app.signup.resend.api-key=${RESEND_API_KEY:}
app.signup.resend.from=${RESEND_FROM_EMAIL:}
app.signup.resend.to=${RESEND_TO_EMAIL:${APP_SUPER_ADMIN_EMAIL:}}

# bootstrap company admin properties
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.company-id=${APP_BOOTSTRAP_ADMIN_COMPANY_ID:00000000-0000-0000-0000-000000000001}
app.bootstrap-admin.company-name=${APP_BOOTSTRAP_ADMIN_COMPANY_NAME:Juuls Trinkets}
app.bootstrap-admin.allowed-user-count=${APP_BOOTSTRAP_ADMIN_ALLOWED_USER_COUNT:10}
app.bootstrap-admin.location-name=${APP_BOOTSTRAP_ADMIN_LOCATION_NAME:Juuls Trinkets}
app.bootstrap-admin.user-id=${APP_BOOTSTRAP_ADMIN_USER_ID:00000000-0000-0000-0000-000000000002}
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
