spring.application.name=bar-scan
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]
jwt.secret=${JWT_SECRET:bar-scan-development-secret-must-be-at-least-32-bytes}
jwt.expiration-ms=86400000
# https properties
server.port=8080
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=keystore.p12
server.ssl.key-store-password=220598Sjk
server.ssl.keyStoreType=PKCS12
server.ssl.keyAlias=tomcat

# mysql properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bar_scan?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:bar_scan}
spring.datasource.password=${DB_PASSWORD:bar_scan}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# rabbitmq message queue properties
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.messaging.product-created-exchange=${PRODUCT_CREATED_EXCHANGE:bar-scan.products}
app.messaging.product-created-queue=${PRODUCT_CREATED_QUEUE:bar-scan.product-created}
app.messaging.product-created-routing-key=${PRODUCT_CREATED_ROUTING_KEY:product.created}

# cors properties
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],https://localhost:[*],http://127.0.0.1:[*],https://127.0.0.1:[*],http://10.0.2.2:[*],https://10.0.2.2:[*],capacitor://localhost,ionic://localhost}

# local bootstrap admin properties
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.company-id=${APP_BOOTSTRAP_ADMIN_COMPANY_ID:00000000-0000-0000-0000-000000000001}
app.bootstrap-admin.user-id=${APP_BOOTSTRAP_ADMIN_USER_ID:00000000-0000-0000-0000-000000000002}
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:2}
